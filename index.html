<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meridian — Timezone Planner</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#28210f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5ede0" media="(prefers-color-scheme: light)">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js"></script>

<style>
  :root {
    --bg: oklch(0.16 0.012 65);
    --bg-raised: oklch(0.20 0.013 65);
    --bg-card: oklch(0.23 0.014 65);
    --fg: oklch(0.96 0.008 80);
    --fg-dim: oklch(0.72 0.015 75);
    --fg-faint: oklch(0.52 0.012 70);
    --line: oklch(0.30 0.012 65);
    --line-soft: oklch(0.26 0.012 65);
    --sun: oklch(0.82 0.14 75);
    --moon: oklch(0.70 0.08 265);
    --accent: oklch(0.78 0.12 70);
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  .font-serif-display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* subtle grain */
  .grain::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* no focus rings on tap */
  button:focus { outline: none; }
  button:focus-visible { outline: 1px solid var(--fg-dim); outline-offset: 2px; border-radius: 4px; }

  /* hide scrollbar for clean mobile feel */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
</style>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)',
          'bg-raised': 'var(--bg-raised)',
          'bg-card': 'var(--bg-card)',
          fg: 'var(--fg)',
          'fg-dim': 'var(--fg-dim)',
          'fg-faint': 'var(--fg-faint)',
          line: 'var(--line)',
          'line-soft': 'var(--line-soft)',
          sun: 'var(--sun)',
          moon: 'var(--moon)',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          serif: ['Instrument Serif', 'Georgia', 'serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        }
      }
    }
  };
</script>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script src="./data/cities.js"></script>
  <script type="text/babel" data-presets="env,react" src="./src/app.jsx"></script>
</body>
</html>
